services:
  - type: web
    name: empire-capital-online-2026
    runtime: docker
    plan: starter
    region: ohio
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    disk:
      name: empire-capital-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /data
      - key: PUBLIC_DIR
        value: /tmp/ec-public
      - key: TRUST_PROXY
        value: "1"
      - key: ORIGIN
        value: https://empire-capital-online-2026.onrender.com
      - key: ADMIN_TOKEN
        generateValue: true
